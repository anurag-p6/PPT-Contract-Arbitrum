[profile.default]
src = "src"
out = "out"
libs = ["lib"]

[rpc_endpoints]
arbitrum-sepolia = "${ARBITRUM_SEPOLIA_RPC}"
arbitrum-mainnet = "${ARBITRUM_MAINNET_RPC}"

[etherscan]
arbitrum-sepolia = { key = "${ETHERSCAN_API_KEY}" }
arbitrum-mainnet = { key = "${ETHERSCAN_API_KEY}", chain = "arbitrum" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options